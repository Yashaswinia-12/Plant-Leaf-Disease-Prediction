<!DOCTYPE html>
<html>
<head>
    <title>Cinnamon Quality Classification</title>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;

            background: linear-gradient(rgba(20,20,20,0.7), rgba(40,20,0,0.8)),
            url("https://thumbs.dreamstime.com/b/texture-spilling-coffee-beans-chocolate-cinnamon-cloves-top-view-copy-space-texture-spilling-coffee-beans-chocolate-cinnamon-143191874.jpg");

            background-size: cover;
            color: white;
        }

        .container {
            width: 450px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 25px;

            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);

            box-shadow: 0 0 30px rgba(255,140,0,0.5);
            animation: fadeIn 1s ease;
        }

        h2 {
            text-align: center;
            color: #ffb347;
            letter-spacing: 1px;
        }

        .top-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 2px solid orange;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 10px;
            border: none;
            outline: none;

            background: rgba(255,255,255,0.2);
            color: white;
        }

        input::placeholder {
            color: #ddd;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            border-radius: 12px;
            border: none;

            background: linear-gradient(45deg, #ff7e00, #ffb347);
            font-weight: bold;
            font-size: 16px;

            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.07);
            box-shadow: 0 0 15px orange;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 15px;

            background: rgba(0,0,0,0.7);
            animation: slideUp 0.7s ease;
        }

        .algo {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            margin-top: 5px;

            border-radius: 8px;
            background: rgba(255,255,255,0.1);
        }

        .best {
            color: #00ff99;
            font-size: 18px;
            text-align: center;
            margin-top: 10px;
        }

        .prediction {
            text-align: center;
            font-size: 20px;
            color: #ffd700;
        }

        /* Animations */
        @keyframes fadeIn {
            from {opacity:0; transform: translateY(20px);}
            to {opacity:1; transform: translateY(0);}
        }

        @keyframes slideUp {
            from {opacity:0; transform: translateY(30px);}
            to {opacity:1; transform: translateY(0);}
        }
    </style>
</head>

<body>

<div class="container">

    <img class="top-img" src="https://img.freepik.com/free-photo/anise-cinnamon-coffee-beans-old-wooden-background_2829-11687.jpg?semt=ais_hybrid&w=740&q=80">

    <h2>🪵 Cinnamon Quality Classifier 🍂</h2>
    <a href="/logout/" style="float:right; color:white;">Logout</a>

    <form method="POST">
        {% csrf_token %}

        <input type="number" step="any" name="Moisture" placeholder="🌧 Moisture (%)" required>
        <input type="number" step="any" name="Ash" placeholder="🔥 Ash (%)" required>
        <input type="number" step="any" name="Volatile_Oil" placeholder="💧 Volatile Oil" required>
        <input type="number" step="any" name="Acid_Insoluble_Ash" placeholder="🧪 Acid Insoluble Ash" required>
        <input type="number" step="any" name="Chromium" placeholder="⚙ Chromium" required>
        <input type="number" step="any" name="Coumarin" placeholder="🌰 Coumarin" required>

        <button type="submit">🚀 Predict Quality</button>
    </form>

    {% if result %}
    <div class="result">

        <div class="prediction">
            📊 Predicted Quality: <b>{{ result }}</b>
        </div>

        <div class="algo">
            <span>KNN</span>
            <span>{{ knn_acc }}%</span>
        </div>

        <div class="algo">
            <span>Logistic Regression</span>
            <span>{{ lr_acc }}%</span>
        </div>

        <div class="algo">
            <span>SVM</span>
            <span>{{ svm_acc }}%</span>
        </div>

        <div class="best">
            🏆 Best Model: {{ best_algo }}
        </div>

    </div>
    {% endif %}

</div>

</body>
</html>
