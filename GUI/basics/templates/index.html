    .navbar {
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }

    .navbar-brand {
      color: orange !important;
      font-weight: bold;
    }

    .card-box {
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(255,140,0,0.4);
      transition: 0.3s;
    }

    .card-box:hover {
      transform: translateY(-8px);
      box-shadow: 0 0 30px orange;
    }

    .card-box img {
      width: 70px;
      margin-bottom: 10px;
    }

    .btn-custom {
      background: linear-gradient(45deg, orange, gold);
      border: none;
      padding: 8px 18px;
      border-radius: 10px;
      color: black;
      font-weight: bold;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      background: rgba(0,0,0,0.6);
      padding: 10px;
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand">ML Dashboard</a>
    <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
  </div>
</nav>

<div class="container mt-5">

  <div class="row g-4">

    <!-- Cinnamon -->
    <div class="col-md-3">
      <div class="card-box">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTvfdk55M3U7YNcrKv8QTtcLacfqDpJL5BA0w&s">
        <h5>Cinnamon</h5>
        <a href="{% url 'cinnamon' %}" class="btn btn-custom">Open</a>
      </div>
    </div>

    <!-- Banana -->
    <div class="col-md-3">
      <div class="card-box">
        <img src="https://www.bbassets.com/media/uploads/p/l/20003403_5-fresho-banana-leaf.jpg">
        <h5>Banana Leaf</h5>
        <a href="{% url 'banana_leaf' %}" class="btn btn-custom">Open</a>
      </div>
    </div>

    <!-- Marks -->
    <div class="col-md-3">
      <div class="card-box">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
        <h5>Marks Predictor</h5>
        <a href="{% url 'predict' %}" class="btn btn-custom">Open</a>
      </div>
    </div>

    <!-- ABC -->
    <div class="col-md-3">
      <div class="card-box">
        <img src="https://cdn-icons-png.flaticon.com/512/3898/3898082.png">
        <h5>ABC Module</h5>
        <a href="{% url 'abc' %}" class="btn btn-custom">Open</a>
      </div>
    </div>

    <!-- LED -->
    <div class="col-md-3">
      <div class="card-box">
        <img src="https://tiimg.tistatic.com/fp/1/007/564/8-watt-plastic-white-color-cool-day-electrical-larica-ceramic-led-bulb-for-home-143.jpg">
        <h5>LED Control</h5>
        <a href="{% url 'led' %}" class="btn btn-custom">Open</a>
      </div>
    </div>

    <!-- Calculator -->
    <div class="col-md-3">
      <div class="card-box">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTNSQM8V2Sg4DAtmHehT45_SBQUkbqVgHUGzQ&s">
        <h5>Calculator</h5>
        <a href="{% url 'calci' %}" class="btn btn-custom">Open</a>
      </div>
    </div>

    <!-- Counter -->
    <div class="col-md-3">
      <div class="card-box">
        <img src="https://cdn-icons-png.flaticon.com/512/1828/1828919.png">
        <h5>Counter</h5>
        <a href="{% url 'counter' %}" class="btn btn-custom">Open</a>
      </div>
    </div>

    <!-- Employee -->
    <div class="col-md-3">
      <div class="card-box">
        <img src="https://cdn-icons-png.flaticon.com/512/1946/1946429.png">
        <h5>Employee's List</h5>
        <a href="{% url 'Employee' %}" class="btn btn-custom">Add</a><br><br>
        <a href="{% url 'Employee_View' %}" class="btn btn-custom">View</a>
      </div>
    </div>

    <!-- Classification -->
    <div class="col-md-3">
      <div class="card-box">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdA8upT6vKXheO-Kmk_gCTTL3A0VNmT2ozbw&s">
        <h5>Classification</h5>
        <a href="{% url 'Classification' %}" class="btn btn-custom">Open</a>
      </div>
    </div>

  </div>

</div>
</body>
</html>
