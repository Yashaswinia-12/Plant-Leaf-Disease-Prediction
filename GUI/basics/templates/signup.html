<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Design by foolishdeveloper.com -->
    <title>Signup Page</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <!--Stylesheet-->
    
</head>
<body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <form action="" method="post">
<style>
*,
*:before,
*:after{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}

body{
    font-family: 'Poppins', sans-serif;

    /* 🌿 CINNAMON BACKGROUND */
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
    url("https://static.vecteezy.com/system/resources/thumbnails/010/081/966/small/abstract-gradient-orange-color-background-free-vector.jpg");

    background-size: cover;
    background-position: center;
}

/* ✨ Animated glow circles */
.background{
    width: 430px;
    height: 600px;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
}

.background .shape{
    height: 200px;
    width: 200px;
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    animation: float 6s infinite ease-in-out;
}

.shape:first-child{
    background: #ff9a3c;
    left: -80px;
    top: -80px;
}

.shape:last-child{
    background: #ff512f;
    right: -30px;
    bottom: -80px;
}

@keyframes float{
    0%{transform: translateY(0px);}
    50%{transform: translateY(-20px);}
    100%{transform: translateY(0px);}
}

/* 🌟 Signup Card */
form{
    width: 420px;
    padding: 40px 30px;

    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);

    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);

    box-shadow: 0 0 40px rgba(255,140,0,0.6);
    
}

form *{
    color: #ffffff;
    outline: none;
    border: none;
}

/* Heading */
form h3{
    font-size: 28px;
    text-align: center;
    margin-bottom: 15px;
    color: #ffb347;
}

/* Labels */
label{
    margin-top: 12px;
    display: block;
    font-size: 14px;
}

/* Inputs */
input{
    width: 100%;
    height: 42px;
    margin-top: 5px;
    border-radius: 10px;
    padding: 0 10px;

    background: rgba(255,255,255,0.1);
    color: white;
}

input:focus{
    border: 1px solid orange;
}

/* Button */
button{
    margin-top: 20px;
    width: 100%;
    padding: 12px;

    background: linear-gradient(45deg, orange, gold);
    color: black;

    font-size: 16px;
    font-weight: bold;

    border-radius: 10px;
    cursor: pointer;

    transition: 0.3s;
}

button:hover{
    transform: scale(1.05);
}

/* Link */
a{
    display: block;
    text-align: center;
    margin-top: 10px;
    color: #ffd580;
    text-decoration: none;
}

a:hover{
    text-decoration: underline;
}
</style> 
        <h3>Signup Here</h3>

        <label for="username"><i class='bx bxs-user'></i> Username</label>
        <input type="text" placeholder="Username" name="username" id="username">

        <label for="email"><i class='bx bxs-envelope'></i> Email</label>
        <input type="email" placeholder="Email or Phone" name="email" id="email">

        <label for="password1"><i class='bx bxs-lock'></i> Password</label>
        <input type="password" placeholder="Password" id="password1" name="password1">


        <label for="password2"><i class='bx bxs-lock'></i> Confirm Password</label>
        <input type="password" placeholder="Confrom Password" id="password2" name="password2">
        <button type="submit">Signup</button>
        
        <a href="{% url 'login' %}" >i have already account</a>
        
    </form>
</body>
</html>
