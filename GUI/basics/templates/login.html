<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Design by foolishdeveloper.com -->
    <title>Login Page</title>
 
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <!--Stylesheet-->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
*,
*:before,
*:after{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}

body{
    font-family: 'Poppins', sans-serif;

    /* 🌿 CINNAMON THEME BACKGROUND */
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
    url("https://img.freepik.com/premium-photo/abstract-colorful-oblique-lines-background-colorful-background_613001-1220.jpg?semt=ais_hybrid&w=740&q=80");

    background-size: cover;
    background-position: center;
}

/* ✨ Animated glowing circles */
.background{
    width: 430px;
    height: 520px;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
}

.background .shape{
    height: 200px;
    width: 200px;
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    animation: float 6s infinite ease-in-out;
}

.shape:first-child{
    background: #ff9a3c;
    left: -80px;
    top: -80px;
}

.shape:last-child{
    background: #ff512f;
    right: -30px;
    bottom: -80px;
}

/* 🔥 floating animation */
@keyframes float{
    0%{transform: translateY(0px);}
    50%{transform: translateY(-20px);}
    100%{transform: translateY(0px);}
}

/* 🌟 GLASS LOGIN CARD */
form{
    height: 520px;
    width: 400px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);

    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);

    box-shadow: 0 0 40px rgba(255,140,0,0.6);

    padding: 50px 35px;
}

form *{
    color: #ffffff;
    letter-spacing: 0.5px;
    outline: none;
    border: none;
}

form h3{
    font-size: 30px;
    text-align: center;
    margin-bottom: 10px;
    color: #ffb347;
}

/* Inputs */
label{
    margin-top: 20px;
    display: block;
}

input{
    height: 45px;
    width: 100%;
    margin-top: 8px;
    border-radius: 10px;
    padding: 0 10px;

    background: rgba(255,255,255,0.1);
    color: white;
}

input:focus{
    border: 1px solid orange;
}

/* Button */
button{
    margin-top: 30px;
    width: 100%;
    padding: 12px;

    background: linear-gradient(45deg, orange, gold);
    color: black;

    font-size: 16px;
    font-weight: bold;

    border-radius: 10px;
    cursor: pointer;

    transition: 0.3s;
}

button:hover{
    transform: scale(1.05);
}

/* Signup link */
a{
    display: block;
    text-align: center;
    margin-top: 15px;
    color: #ffd580;
    text-decoration: none;
}

a:hover{
    text-decoration: underline;
}
</style>
</head>

<body>

    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <form method="post">
        <h3>Login Here</h3>
        {% csrf_token %} 
        <label for="username"><i class='bx bxs-user'></i> Username</label>
        
        <input type="text" placeholder="Enter Username" id="username" name="username">
        
        <label for="password"><i class='bx bxs-lock-alt'></i> Password</label>
        <input type="password" placeholder="Password" id="password" name="pass">

        <button type="submit">Log In</button>
        <!-- <input type="button" value=""> -->
        <!-- <div class="social">
          <div class="go"><i class="fab fa-google"></i>  Google</div>
          <div class="fb"><i class="fab fa-facebook"></i>  Facebook</div>
        </div> -->
        <a href="{% url 'signup' %}" >Create a account</a>
    </form>
</body>
</html>
